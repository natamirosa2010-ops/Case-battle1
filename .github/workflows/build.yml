
name: Build Case Battle Simulator APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          mkdir source
          unzip -o CaseBattleSimulator-source.zip -d source
          find source -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT=$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          echo "Project directory: $PROJECT"
          gradle -p "$PROJECT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaseBattleSimulator-APK
          path: source/**/build/outputs/apk/debug/*.apk
          
